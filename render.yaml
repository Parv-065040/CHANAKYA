services:
  - type: web
    name: chanakya
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - {key: GROQ_API_KEY, sync: false}
      - {key: STORAGE_BACKEND, value: supabase}
      - {key: SUPABASE_URL, sync: false}
      - {key: SUPABASE_SERVICE_ROLE_KEY, sync: false}
      - {key: AUTH_MODE, value: tokens}
      - {key: ADMIN_TOKEN, generateValue: true}
      - {key: USER_TOKENS, value: "{}"}
